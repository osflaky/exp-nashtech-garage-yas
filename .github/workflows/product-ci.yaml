name: product service ci

on:
  workflow_dispatch:

jobs:
  Build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          arch: arm64
          runner: windows-11-arm
          expander_leg: windows-latest--arm64
    runs-on: ${{ matrix.runner }}
    env:
      FROM_ORIGINAL_REPOSITORY: ${{ 
        github.event.pull_request.head.repo.full_name == github.repository || 
        github.ref == 'refs/heads/main' }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0    # Shallow clones should be disabled for a better relevancy of analysis
    - uses: ./.github/workflows/actions
    - name: Run Maven Build Command
      run: mvn clean install -pl product -am
    - name: Run Maven Checkstyle
      if: ${{ env.FROM_ORIGINAL_REPOSITORY == 'true' }}
      run: mvn checkstyle:checkstyle -pl product -am 
        -Dcheckstyle.output.file=product-checkstyle-result.xml
    - name: Upload Checkstyle Result
      if: ${{ env.FROM_ORIGINAL_REPOSITORY == 'true' }}
      uses: jwgmeligmeyling/checkstyle-github-action@master
      with:
        path: '**/product-checkstyle-result.xml'
    - name: Test Results
      uses: dorny/test-reporter@v1
      if: ${{ env.FROM_ORIGINAL_REPOSITORY == 'true' && (success() || failure())
        }}
      with:
        name: Product-Service-Unit-Test-Results
        path: "product/**/*-reports/TEST*.xml"
        reporter: java-junit
    - name: Analyze with sonar cloud
      if: ${{ env.FROM_ORIGINAL_REPOSITORY == 'true' }}
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -f product
    - name: OWASP Dependency Check
      if: ${{ env.FROM_ORIGINAL_REPOSITORY == 'true' }}
      shell: bash
      run: mvn org.owasp:dependency-check-maven:12.1.0:check -f product 
        -Dformat=HTML -Dodc.outputDirectory="${{ github.workspace }}/reports"
    - name: Upload OWASP Dependency Check results
      if: ${{ env.FROM_ORIGINAL_REPOSITORY == 'true' }}
      uses: actions/upload-artifact@master
      with:
        name: OWASP Dependency Check Report
        path: ${{github.workspace}}/reports
    - name: Add coverage report to PR
      uses: madrapps/jacoco-report@v1.6.1
      if: ${{ env.FROM_ORIGINAL_REPOSITORY == 'true' }}
      with:
        paths: ${{github.workspace}}/product/target/site/jacoco/jacoco.xml
        token: ${{secrets.GITHUB_TOKEN}}
        min-coverage-overall: 80
        min-coverage-changed-files: 60
        title: 'Product Coverage Report'
        update-comment: true
    - name: Log in to the Container registry
      if: ${{ github.ref == 'refs/heads/main' }}
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push Docker images
      if: ${{ github.ref == 'refs/heads/main' }}
      uses: docker/build-push-action@v6
      with:
        context: ./product
        push: true
        tags: ghcr.io/nashtech-garage/yas-product:latest
    name: Build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
